name: Armbian hardware skill
on:
  push:
    paths: ['armbian-skills/**', '.github/workflows/armbian-skills.yml']
  pull_request:
    paths: ['armbian-skills/**', '.github/workflows/armbian-skills.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: armbian-skills
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/refresh_catalog.py --check
      - run: python scripts/render_wiring_examples.py --check
      - run: python scripts/build_skills.py
      - run: python scripts/build_skills.py --check
      - run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: armbian-hardware-development
          path: armbian-skills/dist/
